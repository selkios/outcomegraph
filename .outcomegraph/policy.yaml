schema_version: 2
created_at: "2026-03-08T13:53:57Z"
name: observe-policy
mode: observe
allow:
  file_writes:
    - ".outcomegraph/**"
    - "export/**"
    - "skills/outcome-steward/**"
    - "AGENTS.md"
    - "CONTEXT.md"
  verify_commands:
    - "npm test --listTests"
    - "npm test"
    - "npm test*"
    - "go test ./..."
    - "go test ./...*"
    - "pytest -q"
    - "pytest -q*"
    - "uv run --with pytest --no-project pytest -q*"
    - "uv run --with pytest pytest -q*"
    - "uv run pytest -q*"
    - "python -m unittest -q*"
    - "python3 -m unittest -q*"
  sandbox_operations:
    - create_isolated_worktree
    - read_repo_state
    - read_artifacts
deny:
  file_writes:
    - "src/**"
    - "lib/**"
    - "app/**"
    - "packages/**"
  network:
    - unrestricted
  dependencies:
    - "npm install"
    - "pip install"
    - "cargo add"
    - "go mod tidy"
  deployment:
    - push
    - git commit --amend
    - github pr create
    - gha workflow_dispatch
